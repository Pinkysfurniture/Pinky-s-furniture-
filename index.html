<!-- =========================
     JAVASCRIPT
========================= -->
<script>
function moverCarrusel(id, direccion) {
  const contenedor = document.getElementById(id);
  const desplazamiento = contenedor.clientWidth * 0.8;

  contenedor.scrollBy({
    left: direccion * desplazamiento,
    behavior: "smooth"
  });
}
</script>
