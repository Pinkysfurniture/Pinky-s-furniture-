<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muebles | Pinky's Furniture</title>

<link rel="stylesheet" href="estilos.css">

</head>

<body>


<header class="encabezado-secundario">

    <a
        href="index.html"
        class="volver"
    >
        ← Pinky's Furniture
    </a>


    <h1>Muebles</h1>

    <p>
        Muebles de madera y soluciones para tu espacio
    </p>


    <div class="buscador-pagina">

        <input
            type="text"
            id="busqueda"
            placeholder="Buscar muebles..."
        >

        🔍

    </div>

</header>



<main class="contenedor">

    <div
        id="listaProductos"
        class="productos-grid"
    ></div>

</main>



<!-- CARRITO -->

<button
    class="boton-carrito"
    onclick="abrirCarrito()"
>

    🛒

    <span
        id="contadorCarrito"
        class="contador"
    >
        0
    </span>

</button>



<aside
    id="carritoPanel"
    class="carrito-panel"
>

    <div class="carrito-header">

        <h2>Mi carrito</h2>

        <button onclick="cerrarCarrito()">
            ×
        </button>

    </div>


    <div
        id="carritoContenido"
        class="carrito-contenido"
    ></div>


    <div class="carrito-footer">

        <div class="total">

            <span>Total</span>

            <strong id="carritoTotal">
                $0
            </strong>

        </div>


        <button
            class="boton-principal"
            onclick="abrirFormulario()"
        >

            Continuar compra

        </button>

    </div>

</aside>



<!-- FORMULARIO -->

<div
    id="modalFormulario"
    class="modal"
>

    <div class="formulario">

        <button
            class="cerrar-modal"
            onclick="cerrarFormulario()"
        >
            ×
        </button>

        <h2>Datos del cliente</h2>


        <label>Nombre completo *</label>

        <input
            type="text"
            id="nombreCliente"
        >


        <label>Teléfono *</label>

        <input
            type="tel"
            id="telefonoCliente"
        >


        <label>Correo electrónico</label>

        <input
            type="email"
            id="correoCliente"
        >


        <label>Dirección *</label>

        <input
            type="text"
            id="direccionCliente"
        >


        <label>Comuna *</label>

        <input
            type="text"
            id="comunaCliente"
        >


        <label>Observaciones</label>

        <textarea
            id="observacionesCliente"
        ></textarea>


        <button
            class="boton-whatsapp-final"
            onclick="enviarPedidoWhatsApp()"
        >

            💬 Enviar pedido por WhatsApp

        </button>

    </div>

</div>



<a
    href="https://wa.me/56921655008"
    target="_blank"
    class="whatsapp-flotante"
>

    💬

</a>



<footer>

    <strong>Pinky's Furniture</strong>

    <p>
        Muebles y soluciones para tu negocio
    </p>

</footer>



<script src="productos.js"></script>
<script src="carrito.js"></script>


<script>

/* =====================================
   MOSTRAR SOLO MUEBLES
===================================== */

const contenedor =
    document.getElementById("listaProductos");


function mostrarMuebles(lista = productos) {

    const muebles =
        lista.filter(
            producto =>
            producto.categoria === "Muebles"
        );


    mostrarProductosEnContenedor(
        muebles,
        contenedor
    );

}


mostrarMuebles();


/* =====================================
   BUSCADOR
===================================== */

document
.getElementById("busqueda")
.addEventListener("input", function() {

    const texto =
        this.value.toLowerCase().trim();


    const resultados =
        productos.filter(producto =>

            producto.categoria === "Muebles"

            &&

            (
                producto.nombre
                .toLowerCase()
                .includes(texto)

                ||

                producto.codigo
                .toLowerCase()
                .includes(texto)
            )

        );


    mostrarProductosEnContenedor(
        resultados,
        contenedor
    );

});

</script>

</body>

</html>
